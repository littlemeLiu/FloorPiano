<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柯南少年偵探團：踩數字敏捷力大作戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 預覽卡片外觀 (仿 Line / 聊天室分享卡片) */
        #preview-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
            position: relative;
            transition: transform 0.2s;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-icon {
            background: #e4e6eb;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .card-title-area {
            flex-grow: 1;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            color: #111;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .card-time {
            font-size: 13px;
            color: #65676b;
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .open-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .open-btn:hover {
            background-color: #1976D2;
        }

        .open-btn:active {
            transform: scale(0.96);
        }

        /* 遊戲主畫面 (預設隱藏) */
        #game-container {
            display: none;
            background: #1a1a2e;
            color: #fff;
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 24px;
            overflow: hidden;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #2a2a40;
            padding-bottom: 12px;
        }

        .game-header h2 {
            font-size: 20px;
            color: #00d2ff;
        }

        .back-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 垂直角色清單區 */
        .section-title {
            font-size: 16px;
            margin-bottom: 10px;
            color: #a0a0c0;
        }

        .character-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .char-row {
            display: flex;
            align-items: center;
            background: #16213e;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #0f3460;
            gap: 12px;
        }

        .char-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00d2ff;
            background: #000;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            overflow: hidden;
        }

        .char-info {
            flex-grow: 1;
        }

        .char-name {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
        }

        .char-type {
            font-size: 12px;
            color: #00d2ff;
        }

        /* 遊戲控制與版面 */
        .game-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
